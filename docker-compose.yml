# Vorlage für die Log-Begrenzung (spart Platz und Arbeit)
x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

x-service-dependencies: &service-dependencies
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  postgres:
    <<: *default-logging
    image: postgres:17
    container_name: mobiliti-dashboard-postgres17
    restart: unless-stopped
    env_file: .env
    volumes:
      - mobiliti_dashboard_pg17_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    <<: *default-logging
    image: redis:7
    container_name: mobiliti-dashboard-redis
    restart: unless-stopped
    volumes:
      - mobiliti_dashboard_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    <<: *default-logging
    ports:
      - "127.0.0.1:5001:5000"    
    build: ./backend
    container_name: mobiliti-dashboard-api
    restart: unless-stopped
    env_file: .env
    depends_on: *service-dependencies
    volumes:
      - mobiliti_dashboard_public_directory_logos:/app/public/directory_logos
      - mobiliti_dashboard_public_logos:/app/public/logos
      - mobiliti_dashboard_public_social_media:/app/public/social-media
      - mobiliti_dashboard_public_grafiken:/app/public/grafiken
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker-ai:
    <<: *default-logging
    build: ./backend
    container_name: mobiliti-worker-ai
    restart: unless-stopped
    env_file: .env
    depends_on: *service-dependencies

  worker-scrape:
    <<: *default-logging
    build: ./backend
    container_name: mobiliti-worker-scrape
    restart: unless-stopped
    shm_size: '1gb'
    env_file: .env
    depends_on: *service-dependencies

  worker-mail:
    <<: *default-logging
    build: ./backend
    container_name: mobiliti-worker-mail
    restart: unless-stopped
    env_file: .env
    depends_on: *service-dependencies

  worker-data:
    <<: *default-logging
    build: ./backend
    container_name: mobiliti-worker-data
    restart: unless-stopped
    env_file: .env
    depends_on: *service-dependencies

  worker-funding:
    <<: *default-logging
    build: ./backend
    container_name: mobiliti-worker-funding
    restart: unless-stopped
    env_file: .env
    depends_on: *service-dependencies

volumes:
  mobiliti_dashboard_pg17_data:
  mobiliti_dashboard_redis_data:
  mobiliti_dashboard_public_directory_logos:
  mobiliti_dashboard_public_logos:
  mobiliti_dashboard_public_social_media:
  mobiliti_dashboard_public_grafiken:
