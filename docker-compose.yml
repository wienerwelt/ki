services:
  postgres:
    image: postgres:16
    container_name: mobiliti-dashboard-postgres16
    restart: unless-stopped
    environment:
      POSTGRES_DB: dashboard-mobiliti_lokal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dnp74npd
    ports:
      - "5433:5432"
    volumes:
      - mobiliti_dashboard_pg16_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: mobiliti-dashboard-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - mobiliti_dashboard_redis_data:/data

volumes:
  mobiliti_dashboard_pg16_data:
  mobiliti_dashboard_redis_data: