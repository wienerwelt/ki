services:
  postgres:
    ports:
      - "127.0.0.1:5434:5432"

  redis:
    ports:
      - "127.0.0.1:6381:6379"

  api:
    # Ohne Dateiwächter: sechs parallele nodemon-Instanzen auf Windows-/WSL-
    # Bind-Mounts können mit ENOMEM ausfallen. Frontend-HMR bleibt unberührt.
    command: npm start
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/public/directory_logos:/app/public/directory_logos
      - ./backend/public/logos:/app/public/logos
      - ./frontend/dist:/frontend/dist:ro
    env_file:
      - .env

  worker-ai:
    command: npm run start:ai
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - .env

  worker-scrape:
    command: npm run start:scrape
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - .env

  worker-mail:
    command: npm run start:mail
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - .env

  worker-data:
    command: npm run start:data
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - .env

  worker-funding:
    command: npm run start:funding
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - .env
